# The host's SSH settings come from ~/.ssh/config. Ansible uses the inventory
# name as the SSH host, so an entry like this is enough:
#
#   Host resumaker.skinet.org
#       HostName 203.0.113.10
#       User deploy
#       IdentityFile ~/.ssh/id_ed25519
#
all:
  children:
    resumaker:
      hosts:
        resumaker.skinet.org:
