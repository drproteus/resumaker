{{define "content"}}
<div class="row justify-content-center">
    <div class="col-sm-8 col-md-6 col-lg-4">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h4 mb-2">Sign in</h1>
                <p class="text-body-secondary mb-4">Keep your resumes in one place and render them whenever you need.</p>
                <div class="d-grid gap-2">
                    {{range .Data}}
                    <a class="btn btn-outline-dark btn-lg" href="/auth/{{.Slug}}/login">Continue with {{.Label}}</a>
                    {{end}}
                </div>
            </div>
        </div>
    </div>
</div>
{{end}}
