{{define "layout"}}<!DOCTYPE html>
<html lang="en" data-bs-theme="auto">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{.Title}} · Resumaker</title>
    <link rel="stylesheet" href="/static/bootstrap.min.css">
</head>
<body class="bg-body-tertiary min-vh-100">
    <nav class="navbar bg-body border-bottom">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="/">Resumaker</a>
            {{with .User}}
            <div class="d-flex align-items-center gap-3">
                <span class="text-body-secondary small">{{.DisplayName}}</span>
                <form method="post" action="/logout" class="m-0">
                    <button class="btn btn-outline-secondary btn-sm" type="submit">Sign out</button>
                </form>
            </div>
            {{end}}
        </div>
    </nav>
    <main class="container py-4">
        {{template "content" .}}
    </main>
    {{block "scripts" .}}{{end}}
</body>
</html>{{end}}
